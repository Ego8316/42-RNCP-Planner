name: CI

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    quality:
        name: Quality checks
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun ci

            - name: Generate PandaCSS
              run: bun run panda:build

            - name: Check formatting
              run: bun run format:check

            - name: Lint
              run: bun run lint

            - name: Type check
              run: bun run typecheck

            - name: Test
              run: bun run test

            - name: Check PandaCSS output
              run: bun run panda:check

            - name: Build
              run: bun run build
